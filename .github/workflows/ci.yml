name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: swift test --package-path CopyForLLMCore

  build:
    name: App build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          # CODE_SIGNING_ALLOWED=NO is required as well: the extensions declare
          # entitlements, and signing those fails on a runner with no identity.
          xcodebuild -project CopyForLLM.xcodeproj -scheme CopyForLLM \
            -configuration Release -derivedDataPath .build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
