name: CopyForLLM
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  CopyForLLMCore:
    path: CopyForLLMCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc signing so contributors can build without a certificate; release
    # builds override this with Developer ID (see Packaging/).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.2.2"
  configs:
    Release:
      # Xcode otherwise injects com.apple.security.get-task-allow (the debugger
      # attach entitlement), which notarization rejects as a critical error.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targetTemplates:
  QuickAction:
    type: app-extension
    platform: macOS
    sources:
      - Extensions/${dir}
      - Extensions/Shared
    dependencies:
      - package: CopyForLLMCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.copyforllm.${bundleSuffix}
    # pkd refuses to register unsandboxed app extensions. The temporary exception
    # gives the sandboxed extensions access to the shared settings directory —
    # fine for direct distribution; an App Store build would use an App Group.
    entitlements:
      path: Extensions/${dir}/Action.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/CopyForLLM/
    info:
      path: Extensions/${dir}/Info.plist
      properties:
        CFBundleDisplayName: ${displayName}
        CFBundleName: ${displayName}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.services
          # Bare @objc name (see each target's ActionRequestHandler.swift) —
          # module-qualified Swift names are an unreliable principal class.
          NSExtensionPrincipalClass: CopyForLLM${dir}Handler
          NSExtensionAttributes:
            # The action reads the selection and writes the clipboard; it does
            # not return edited content, so it is a Viewer, not an Editor.
            NSExtensionServiceRoleType: NSExtensionServiceRoleTypeViewer
            NSExtensionServiceAllowsFinderPreviewItem: true
            # Every attachment in the selection must be a file or folder.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem,
              SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.item").@count
              == $extensionItem.attachments.@count).@count == 1

targets:
  CopyForLLM:
    type: application
    platform: macOS
    sources:
      - App
      - path: Packaging/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: CopyForLLMCore
      - target: CopyDefaultAction
        embed: true
      - target: CopyTreeAction
        embed: true
      - target: CopyPathsAction
        embed: true
      - target: CopyOptionsAction
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.copyforllm
        PRODUCT_NAME: Copy for LLM
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Copy for LLM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        # Menu-bar-only: no Dock icon, no ⌘-Tab entry. The MenuBarExtra in
        # CopyForLLMApp.swift is the entry point for Options and Settings.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: MIT License
        CFBundleURLTypes:
          - CFBundleURLName: app.copyforllm
            CFBundleURLSchemes:
              - copyforllm

  CopyDefaultAction:
    templates: [QuickAction]
    templateAttributes:
      dir: CopyDefault
      bundleSuffix: action-copy
      displayName: "Copy for LLM"

  CopyTreeAction:
    templates: [QuickAction]
    templateAttributes:
      dir: CopyTree
      bundleSuffix: action-tree
      displayName: "Copy Tree for LLM"

  CopyPathsAction:
    templates: [QuickAction]
    templateAttributes:
      dir: CopyPaths
      bundleSuffix: action-paths
      displayName: "Copy Paths"

  CopyOptionsAction:
    templates: [QuickAction]
    templateAttributes:
      dir: CopyOptions
      bundleSuffix: action-options
      displayName: "Copy for LLM (Options…)"
